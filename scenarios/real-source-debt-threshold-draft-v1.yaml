      "text": "[Panizza and Presbitero, 2014] In an OECD sample, a negative debt-growth correlation disappeared after the analysis addressed endogeneity. The paper reported no evidence of a causal debt-to-growth effect in that sample. This concerns causal interpretation; it does not prove that no relationship can exist in every country or period.",
