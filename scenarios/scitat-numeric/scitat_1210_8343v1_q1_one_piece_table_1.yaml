      "citation": "SciTaT item 1210.8343v1-q1",
      "summary": "Performance of different functionals with dispersion energy on the S22 database\nof intermolecular interactions. The errors are measured with respect to basis-set\nextrapolated CCSD(T) calculations of Takatani \\textit{et al.}~\\cite{Sherrill-S22}.\nMean absolute relative errors (MARE in \\%), standard deviation (SD in kcal/mol), and mean\nabsolute errors (MAE in kcal/mol) are reported. The postfix ``-2D'' means that the dispersion\nenergy is added using the second-order expansion of Eq.~(\\ref{eqRPAscr}), while\n``-$\\infty$D'' means that the dispersion energy is computed to infinite order.\nThe DFT calculations have been carried out with the FHI-aims code~\\cite{blum2009}\nusing a large numeric tier 3 basis set. For DFT, this basis set is converged to\nbetter than 0.05 kcal/mol compared to the basis set limit~\\cite{jctc-2011}.\n\\mbox{} | \\mbox{$\\beta$} | \\mbox{MARE} | \\mbox{SD} | \\mbox{MAE}\nPBE-2D | 2.06 | 11.6\\% | 0.84 | 0.64\nPBE-$\\infty$D | 2.50 | 7.1\\% | 0.57 | 0.43\nPBE0-2D | 2.12 | 11.4\\% | 0.96 | 0.72\nPBE0-$\\infty$D | 2.52 | 7.2\\% | 0.66 | 0.52",
