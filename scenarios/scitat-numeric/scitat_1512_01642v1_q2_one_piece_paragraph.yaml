      "citation": "SciTaT item 1512.01642v1-q2",
      "summary": "{\\bf Relaxed Radius-margin Bound.} As described above, the training data for grayscale-depth human activity recognition are scarce. Thus, for the last fully connected layer, we adopt the SVM classifier by incorporating with the relaxed radius-margin bound, resulting in the R-SVM + LCNN model. { To justify the role of the relaxed radius-margin bound, Table~\\ref{tab:r-svm} compares the accuracies of Softmax + LCNN, SVM + LCNN, and R-SVM + LCNN on all datasets with the same experimental settings. It is observed that the max-margin based classifiers (SVM and R-SVM) are particularly effective on small scale datasets (CAD120, SBU, OA1, OA2, Merged\\_50). On average, the accuracy of R-SVM + LCNN is average $6.5\\%$ higher than that of Softmax + LCNN, and is about $1\\%$ higher than that of SVM + LCNN. On Merged\\_4 dataset, the improvement of R-SVM + LCNN is incrementally evident, $1.8\\%$ higher than Softmax + LCNN. These results finely accord with our motivation of incorporating the radius-margin bound into our deep learning framework.} Moreover, when the model is learned without pre-training, R-SVM + LCNN gains about $4\\%$ and $8\\%$ improvements over Softmax + LCNN and SVM + LCNN by accuracy, respectively, as Table~\\ref{tab:pretrain} reports.",
