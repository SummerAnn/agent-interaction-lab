      "citation": "SciTaT item 1511.02919v1-q2",
      "summary": "\\subsection {Combining Different IQA Databases}\n\\label{sec:combineDatabases}\nSince NR IQA algorithms are generally trained and tested on various splits of a single dataset (as described above), it is natural to wonder if the trained set of parameters are database specific. In order to demonstrate that the training process is simply a calibration, and that once such training is performed, an ideal blind IQA model should be able to assess the quality of any distorted image (from the set of distortions it is trained for), we evaluated the performance of the multi-model FRIQUEE algorithm on combinations of different image databases - the LIVE IQA Database \\cite{live-r2} and the LIVE Multiply Distorted IQA Database \\cite{multiply}, as well as the new LIVE In the Wild Image Quality Challenge Database. The same 80-20 training setup was followed, i.e., after combining images from the different databases, 80\\% of the randomly chosen images were used to train our DBN model and the trained model was then tested on the remaining 20\\% of the image data. We present the results in Table \\ref{tbl:combine-perf}. It is clear from Table \\ref{tbl:combine-perf} that the performance of FRIQUEE is \\emph{not} database dependent and that once trained, it is capable of accurately assessing the quality of images across the distortions (both single and multiple, of different severities) that it is trained for. The results clearly show FRIQUEE's potential to tackle the imminent deluge of visual data and the unavoidable distortions they are bound to contain.",
      "url": "https://github.com/zhxlia/SciTaT",
      "notes": []
    }
