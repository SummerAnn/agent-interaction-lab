    "instruction": "You and three other council members must quickly choose which of three locations in your region should be officially designated as the emergency shelter for an oncoming storm. The shelter must be accessible, safe, free of environmental hazards, and have the capacity for hundreds of people. Only one site truly qualifies. Each site is in a different direction, and time is short. The three options: (a) Mountain Lodge, (b) Riverside Park, (c) Summerfield School. Your decision is urgent, as buses will soon be dispatched to one location only.\n\nShared information known to all participants:\n- All main roads to each shelter remain open as of the last public update, 20 minutes ago.\n- Mountain Lodge's bridge was inspected last month and passed safety checks; there are no weather alerts for the area.\n- Riverside Park has undergone recent upgrades to its facilities to accommodate large groups.\n- Summerfield School is regularly used for community gatherings and has backup generators.\n\nChoose the best answer from: Mountain Lodge, Riverside Park, Summerfield School."
