      "text": "Madsen et al. (2002, NEJM) studied 537,303 Danish children born 1991-1998. The relative risk of autism in vaccinated vs unvaccinated children was 0.92 (95% CI: 0.68-1.24) -- no increased risk. This is 44,775 times larger than Wakefield's 12-child case series.",
