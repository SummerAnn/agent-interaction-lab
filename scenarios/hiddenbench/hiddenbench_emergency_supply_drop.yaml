    "instruction": "You are emergency logistics coordinators tasked with directing a supply plane loaded with water, food, and medicine to land at one of three regional warehouses after severe flooding hit the area. All main roads are partially blocked, but the pilot can reach any warehouse—they just need a quick decision on where it's safest to land and ensure supplies reach local communities promptly. Your team must choose the best landing site from among the three warehouses: Warehouse A (north side, near a river crossing); Warehouse B (central, next to a chemical plant, with upgraded access roads); or Warehouse C (south side, closest to temporary shelters but farthest by road). Only one warehouse is accessible, safe, and able to distribute the supplies. If you select the correct warehouse, the community receives help. If not, valuable supplies will be delayed or lost.\n\nShared information known to all participants:\n- Warehouse B has recently received upgrades to access roads, making it the fastest to reach from the airstrip, and past flights have favored this site.\n- Warehouse A and Warehouse C both have large paved landing zones, but only Warehouse B is adjacent to an emergency response center.\n- Flood maps show that the chemical plant near Warehouse B has not reported any issues yet, and the weather is currently clear.\n\nChoose the best answer from: Warehouse A, Warehouse B, Warehouse C."
