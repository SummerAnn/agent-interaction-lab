      "summary": "\\begin{example}\\label{E:Example3}\nTable~\\ref{T:Table5} shows the comparison between the running times of\nthe methods from Section~\\ref{SS:RatDiff-II-Higher} and\nSection~\\ref{SS:RatDiff-III} for computing higher order derivatives of \na rational B\\'{e}zier curve.\n\nThe following numerical experiments have been conducted. For fixed $n$ and $r$ \nsuch that $n\\geq r\\geq 0$, $1000$ curves of degree $n$ are generated. Their \ncontrol points $\\p{W}_k\\in[-1,1]^2$ and weights $\\omega_k\\in[0.01,2]$ \n$(0\\leq k\\leq n)$ have been generated using the \n\\texttt{std::uniform\\_real\\_distribution} \\texttt{C++17} function. The value and\nthe first $r$ derivatives of each curve are then evaluated at 501 points \n$t_i:=i/500$ $(0\\leq i\\leq 500)$. Each method is tested using the same curves. \nTable~\\ref{T:Table5} shows the total running time of all $501\\times 1000$ \nevaluations of the values and first $r$ derivatives.\n\\end{example}",
