    "correctClaimId": "answer_hospital_a",
    "instruction": "You are on the hospital staff of a rural clinic. A young patient has collapsed with symptoms of a rare but treatable illness. The patient needs to be transferred immediately to a hospital with advanced ICU facilities. There are three hospitals within reach: Hospital A (north), Hospital B (east), and Hospital C (south). You have a single ambulance, and time is critical. Weather conditions are poor (intense rain), some roads may be blocked, and you have no radio contact with the hospitals. Each of you, as staff, have partial updates from local contacts, but you must pool your information to choose which hospital to send the ambulance to. Pick wrong, and the patient may not make it.\n\nShared information known to all participants:\n- The main road to Hospital B has been recently repaired and is the most commonly used route. Hospital B is known for its large ICU and currently has at least one doctor on emergency shift.\n- Hospital A has a good reputation but is smaller and sometimes lacks staff at night. The northern mountain pass leading to Hospital A can become hazardous after heavy rain.\n- Hospital C is the oldest hospital and has a history of equipment failures; it’s reached by a secondary road that sometimes floods. However, its ICU was upgraded last year and their ambulance often helps transfer patients.\n\nChoose the best answer from: Hospital A, Hospital B, Hospital C."
  },
