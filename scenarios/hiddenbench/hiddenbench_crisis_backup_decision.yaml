    "correctClaimId": "answer_charlie",
    "instruction": "Your company’s IT systems have just suffered a major ransomware attack. Senior management is demanding you make an immediate group decision: choose where to send the next full backup copy of all systems. You have contracts in place with three geographically separate data centers—Alpha, Bravo, and Charlie—each with a track record of reliability. Only one can receive the backup now (due to bandwidth limitations), and there's no opportunity to create a second backup for at least a week. If the chosen center fails, company data may be permanently lost, so your group must agree which site offers the best security and continuity under urgent conditions. Each of you has received a short briefing: some details are shared; an additional confidential update has been given to each person, which might affect your assessment of the risks.\n\nShared information known to all participants:\n- Data Center Bravo is currently rated as having the best firewall and intrusion protection according to the latest independent audit report.\n- Alpha, Bravo, and Charlie all report no power outages or physical damage in the past year.\n- The company’s legal department says any site failure could have major regulatory consequences; the primary concern is ensuring the backup stays both physically secure and rapidly accessible.\n- The latest IT operations dashboard reports Alpha is busiest but still within normal usage; Bravo and Charlie at normal load.\n\nChoose the best answer from: Alpha, Bravo, Charlie."
  },
