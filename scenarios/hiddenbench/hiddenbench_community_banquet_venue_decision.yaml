    "instruction": "You are a member of a committee planning your community's annual banquet, which needs to be held this Saturday night due to scheduling conflicts. Your goal is to choose a venue that can accommodate everyone (about 90 guests), allow food catering, and is available on short notice. Three venues are under consideration:\n\n- Lakeview Resort: By the lakeside with outdoor seating for 120.\n- Grand Oak Hotel: Downtown, with a large ballroom.\n- Heritage Public Library: Spacious meeting hall, central location.\n\nYou intend to decide quickly and secure the booking together. Each person receives one unique piece of information about venue availability or restrictions.\n\nShared information known to all participants:\n- Lakeview Resort has a history of providing excellent service and is free on most weekends, and is listed as having outdoor seating for up to 120 guests.\n- Grand Oak Hotel usually requires at least two weeks' notice for events but has the largest ballroom in the area and easy parking.\n- Heritage Public Library allows large gatherings in its event hall, but catering restrictions may apply (for non-packaged food).\n- All three venues are within a 15-minute drive for most community members.\n\nChoose the best answer from: Lakeview Resort, Grand Oak Hotel, Heritage Public Library."
