      "citation": "SciTaT item 1602.03570v3-q1",
      "summary": "\\subsubsection {Further Analysis}\nTo further examine the performance of the proposed DPS, we compare the proposed DPS-based graph embedding discriminant analysis (DPS-DA) with the similar RKHS-based method (RGEDA)\\cite{shirazi2013graph}. In addition we compare the proposed DPS-based dictionary learning and sparse coding (DPS-DI) method with kernel-based dictionary learning and sparse coding on SPD manifold (RSR) \\cite{ harandi2012sparse}.  \\cite{harandiriemannian}. \n\nTable. \\ref{tab:BRODATZ_further} shows that on average DPS-based discriminative analysis out performs RKHS-based discriminative analysis in all the sequences of the BRODATZ dataset. It performs on par with TSC, which is considered as state of the art method, on $5c$ sequence, and outperforms TSC on all the other sequences. On average DPS-based dictionary learning and sparse coding outperforms both TSC and RSR.\n\nTable. \\ref{tab:ETHZ_further} shows that on average DPS-based discriminative analysis out performs RGDA, RKHS-based discriminative analysis, on ETHZ dataset. IT also outperforms SDALF in all the cases DPS outperforms SDALF \\cite{SDALF_CVPR2010}, which is considered to be the state of the art. It also illustrates that DPS-based dictionary learning and sparse coding outperforms RSR and SDALF in all the cases.\n\nTable. \\ref{tab:TV_Further} shows that on average the DPS-based discriminative analysis outperforms RGEDA, CDL \\cite{wang2012covariance} which is considered as state of the art , on the Virus Texture dataset. It also illustrates that DPS-based dictionary learning and sparse coding outperforms both RSR and CDL.",
