    "instruction": "You are part of a scientific expedition team about to cross a forested region to reach a field station for an urgent wildlife survey. Time is tight, and you can't afford to be delayed. There are three possible field stations to pick as your base: Riverside Station (accessible by the main bridge), Hilltop Cabin (accessible by a winding road), and Valley Edge Outpost (accessible via trails that split from the highway and from the riverside road). Each participant knows the base status, but different team members have received separate logistical updates from park rangers and local authorities. Only one station is reachable and safe for tonight.\n\nShared information known to all participants:\n- A new bridge to Riverside Station was opened last month, and routine checks showed it was in good condition just this morning.\n- All supplies for tonight are already delivered to the three stations.\n- The park's main highway crosses both the river (to Riverside) and leads to the outpost (Valley Edge).\n- Weather this week has been unusually calm aside from some melting snow in the mountains.\n\nChoose the best answer from: Riverside Station, Hilltop Cabin, Valley Edge Outpost."
