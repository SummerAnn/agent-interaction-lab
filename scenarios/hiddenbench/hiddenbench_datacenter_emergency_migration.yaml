    "instruction": "You are IT administrators for a large company whose main datacenter has been crippled by a sudden fire. As a team, you must decide where to immediately re-route all mission-critical operations. Three separate backup datacenters are pre-configured as potential failover sites: Datacenter Alpha, Datacenter Beta, and Datacenter Gamma. Each location has hosted your traffic before, each is in a different city, and each uses different hardware and vendors for redundancy. Time is of the essence. Each of you has access to certain technical updates from your own department, but must consult together to make the final decision. You will be rewarded for successfully directing operations to the only datacenter that can safely take the load right now.\n\nShared information known to all participants:\n- Datacenter Beta is fully online, was just upgraded last month, and currently has low utilization.\n- Staff at Datacenter Alpha confirmed that their on-call engineers are present and have no scheduled maintenance today.\n- Datacenter Gamma is in a region with a minor flood warning but has never experienced significant downtime from weather.\n- Latency and cost are similar for all three options.\n\nChoose the best answer from: Datacenter Alpha, Datacenter Beta, Datacenter Gamma."
  },
