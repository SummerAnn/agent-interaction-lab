{
  "id": "bounded_chat_evidence_reinforcement",
  "title": "Four-message source thread, least-retrieved message removed",
  "memory": {
    "mode": "shared",
    "record": "evidence_board",
    "maxRetrievedEntries": 2,
    "maxStoredEntries": 4,
    "evictionPolicy": "least_retrieved"
  },
  "interaction": {
    "mode": "chat",
    "chatRounds": 1,
    "maxStoredMessages": 4,
    "maxVisibleMessages": 2,
    "maxMessageWords": 40,
    "topology": "fully-connected",
    "chatStyle": "claim-debate",
    "collusion": { "strategy": "none", "visibility": "hidden", "omitContraryEvidence": false, "repeatSupportiveEvidence": false }
  },
  "interventions": {
    "correctionVisibility": "global",
    "correctionTiming": "none"
  }
}
