    "instruction": "You are four scientists tasked by the government to analyze a dangerous new virus as quickly as possible to inform emergency pandemic responses. Three laboratories—Lab Alpha, Lab Beta, and Lab Gamma—are available. An earthquake struck earlier today, causing possible damage throughout the facility. Time is critical: you must start the research within the next several hours.\n\nEach lab has unique equipment and safety features, but you must choose only one. All labs are typically considered safe, but the earthquake may have altered the situation. If you choose the only truly safe and operational lab, the research can proceed. If not, vital evidence could be lost, causing setbacks to containment efforts.\n\nShared information known to all participants:\n- Lab Alpha contains specialized virology equipment but is located in the basement.\n- Lab Beta is on the second floor and was recently reinforced for earthquakes; all chemical storage in Beta remains secure after the quake.\n- Lab Gamma is on the top floor, farther from emergency exits, but has an independent air filtration system that passed government inspection last month.\n- Power is restored to all labs except Gamma, which is still on emergency battery backup.\n\nChoose the best answer from: Lab Alpha, Lab Beta, Lab Gamma."
