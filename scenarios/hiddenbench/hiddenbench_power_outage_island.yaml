    "instruction": "You are a four-person technical team sent to a remote research island. Overnight, power was lost across critical systems, affecting experiments and communications. Your mission: identify the location where the root cause began, so specialist engineers can be dispatched directly. Time is critical—delays could risk irrevocable damage to ongoing research and local wildlife preservation efforts. The potential sources are: 1) the Main Generator Room, 2) the Water Pump Facility, or 3) the Communication Tower. All sites are on different parts of the island and hard to reach. You must choose exactly one source location for the engineers' immediate response.\n\nShared information known to all participants:\n- Power readings indicate the main generator is offline. Emergency lights in the lab are still on, running on backup batteries.\n- Multiple research loggers lost connection to the network exactly at midnight; this is when the main generator alarms sounded.\n- Earlier in the evening, an engineer found nothing unusual in the Main Generator Room.\n- Security logs reveal that a storm struck the island at 11:30pm, with a single bolt of lightning recorded striking close to the Main Generator Room.\n\nChoose the best answer from: Main Generator Room, Water Pump Facility, Communication Tower."
