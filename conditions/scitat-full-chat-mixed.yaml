{
  "id": "scitat_full_chat_mixed",
  "title": "Full discussion with source cards and agent conclusions",
  "memory": {
    "mode": "shared",
    "record": "mixed_record",
    "maxRetrievedEntries": 18,
    "maxStoredEntries": 18,
    "evictionPolicy": "fifo"
  },
  "interaction": {
    "mode": "chat",
    "chatRounds": 3,
    "maxStoredMessages": 18,
    "maxVisibleMessages": 18,
    "maxMessageWords": 40,
    "topology": "fully-connected",
    "chatStyle": "claim-debate",
    "collusion": { "strategy": "none", "visibility": "hidden", "omitContraryEvidence": false, "repeatSupportiveEvidence": false }
  },
  "interventions": {
    "correctionVisibility": "global",
    "correctionTiming": "none"
  }
}
