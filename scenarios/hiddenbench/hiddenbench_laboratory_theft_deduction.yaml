    "instruction": "You are members of a security review panel at a major university, investigating the theft of a prototype device from a tightly controlled building. The theft took place during a two-hour window last night, and records show only three labs had access to the secure vault. University leadership wants you to identify the lab responsible for the theft before pressing charges. You have limited time to reach a consensus based on access records and witness reports. If you choose correctly, the investigation can proceed with minimal fallout. A wrong accusation will damage innocent reputations. After discussing with the three other panel members, you must jointly decide which lab committed the theft. You must be sure, as each lab head has powerful legal representation and will dispute any shaky accusations.\n\nShared information known to all participants:\n- The theft could only have occurred using a specialized code machine. Only Lab Alpha is openly recorded as having this tool.\n- All labs reported their staff were present on site during the night, and security footage showed movement in all three corridors during the time of the theft.\n- Lab Alpha has a history of security violations, including code access issues in the past month.\n\nChoose the best answer from: Lab Alpha, Lab Beta, Lab Gamma."
