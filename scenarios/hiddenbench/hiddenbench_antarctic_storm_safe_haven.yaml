    "instruction": "You and three other participants are scientists at an Antarctic research station. A massive, fast-moving storm is approaching. You must rapidly decide, as a group, which facility to seek shelter in for the next 48 hours. You have snow vehicles and limited time to reach only one location before the blizzard begins. Your three choices:\n- Main Base: The largest facility, but farther away.\n- Retreat Camp: A small, nearby camp rated for storms.\n- Rescue Outpost: Smaller, medium distance, typically used for emergencies.\nWhichever location you pick, you'll be unable to contact others until the storm passes. Supplies, infrastructure, and route safety may differ. Only one option will keep you safe and supplied until rescue teams arrive.\n\nShared information known to all participants:\n- A radio update confirms Retreat Camp is the closest shelter and is built to withstand severe weather.\n- Supply records say that Retreat Camp offers food, water, and sleeping bags for four people.\n- The snow vehicle has just enough fuel to reach any of the three locations before the storm hits, but not to try multiple.\n- The Rescue Outpost's exterior was recently checked and found structurally sound.\n\nChoose the best answer from: Main Base, Retreat Camp, Rescue Outpost."
