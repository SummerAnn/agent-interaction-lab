    {"id": "debt_attribution_D1", "text": "[D1 | Reinhart and Rogoff, 2010] The analysis reported weak debt-growth relationships below 90 percent of GDP and lower growth above that level. It reported an observed pattern; it did not establish that crossing 90 percent causes lower growth.", "visibleToAgentIds": ["analyst_1"], "effects": [{"claimId": "candidate_correct_mapping", "effect": 0.35}, {"claimId": "candidate_cutoff_mapping", "effect": -0.45}]},
    {"id": "debt_attribution_D2", "text": "[D2 | Herndon, Ash, and Pollin, 2014] A recalculation found coding, data-selection, and weighting problems. For the high-debt group, it reported 2.2 percent average annual growth rather than the original negative estimate.", "visibleToAgentIds": ["analyst_2"], "effects": [{"claimId": "candidate_correct_mapping", "effect": 0.5}, {"claimId": "candidate_swapped_mapping", "effect": -0.8}]},
    {"id": "debt_attribution_D3", "text": "[D3 | Panizza and Presbitero, 2014] In an OECD sample, a negative debt-growth correlation disappeared after the analysis addressed endogeneity. The paper reported no evidence of a causal debt-to-growth effect in that sample.", "visibleToAgentIds": ["analyst_3"], "effects": [{"claimId": "candidate_correct_mapping", "effect": 0.5}, {"claimId": "candidate_swapped_mapping", "effect": -0.8}]},
    {"id": "debt_attribution_D4", "text": "[D4 | Panizza and Presbitero, 2013] A survey of advanced-economy research concluded that there is no simple debt-growth relationship and no single threshold separating good from bad outcomes.", "visibleToAgentIds": ["analyst_4"], "effects": [{"claimId": "candidate_correct_mapping", "effect": 0.5}, {"claimId": "candidate_cutoff_mapping", "effect": -0.8}, {"claimId": "candidate_swapped_mapping", "effect": -0.75}]}
