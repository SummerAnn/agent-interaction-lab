      "citation": "SciTaT item 2004.09418v1-q2",
      "summary": "\\subsection {Methodology}\nWe regard the euro area economy as a macro-network of financial exposures, where nodes are the aforementioned institutional sectors (summarized in Table \\ref{tab:1}). Despite the fact that every node of the macro-network is represented at an aggregate level, it is worth mentioning that each node is the result of an aggregation on two dimensions: by country and by sector. More specifically, the euro area macro-network of financial exposures includes the nineteen macro-networks of financial exposures among the institutional sectors operating in the nineteen European Union's Member States belonging to the Eurozone and their mutual interactions. Further, every node of the macro-network should be regarded as a network of micro-based granular financial exposures among the different institutions operating within every institutional sector. The euro area macro-network of financial exposures can be regarded as a multiplex weighted network in which multiple types of links correspond to different financial instruments (e.g., loans, corporate and sovereign bonds, and equity). Links follow the direction of the money and weights correspond to the balance sheet outstanding amount at the end of the period (stocks) of the financial exposures existing among the different institutional sectors through the different financial instruments.",
