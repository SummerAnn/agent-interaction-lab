      "id": "claim_ego_depletion",
      "text": "Willpower operates like a finite resource that depletes with use: performing one self-control task significantly impairs performance on a subsequent unrelated self-control task (the 'ego depletion' effect, d = 0.62).",
      "truthLabel": "false"
    },
    {
      "id": "claim_glucose_mechanism",
      "text": "The mechanism of ego depletion is glucose consumption: self-control tasks measurably reduce blood glucose, and drinking a sugary drink restores self-control performance (Gailliot et al., 2007).",
      "truthLabel": "false"
    },
    {
      "id": "claim_meta_analysis_valid",
      "text": "The original meta-analysis by Hagger et al. (2010) reporting a medium-to-large effect size (d = 0.62) across 83 studies provides robust evidence for the ego depletion effect.",
      "truthLabel": "false"
    },
    {
      "id": "claim_motivation_account",
      "text": "Apparent self-control failures after an initial task are better explained by shifts in motivation, task prioritization, and beliefs about willpower than by a depleted resource.",
      "truthLabel": "true"
    }
  ],
  "evidence": [
    {
      "id": "ev_baumeister_1998",
      "text": "Baumeister et al. (1998, JPSP) introduced the dual-task paradigm: participants who resisted eating cookies performed worse on a subsequent unsolvable puzzle. This foundational study (N=67) has been cited over 7,000 times and launched the ego depletion research program.",
      "effects": [
        { "claimId": "claim_ego_depletion", "effect": 0.4 },
        { "claimId": "claim_meta_analysis_valid", "effect": 0.2 }
      ]
    },
    {
      "id": "ev_hagger_meta_analysis",
      "text": "Hagger et al. (2010) meta-analyzed 83 studies and reported a medium-large effect (d = 0.62). However, Carter & McCullough (2014) identified severe publication bias using funnel plot asymmetry and p-curve analysis, estimating the bias-corrected effect at d = 0.25 or lower.",
      "effects": [
        { "claimId": "claim_ego_depletion", "effect": -0.3 },
        { "claimId": "claim_meta_analysis_valid", "effect": -0.65 }
      ]
    },
    {
      "id": "ev_rrr_2016",
      "text": "A Registered Replication Report (Hagger et al., 2016, Perspectives on Psychological Science) across 23 labs and 2,141 participants found an effect size of d = 0.04 (95% CI: -0.07 to 0.15) -- essentially zero. This pre-registered, high-powered multi-site replication is the strongest direct test of the effect.",
      "effects": [
        { "claimId": "claim_ego_depletion", "effect": -0.8 },
        { "claimId": "claim_meta_analysis_valid", "effect": -0.7 }
      ]
    },
    {
      "id": "ev_glucose_debunked",
      "text": "Kurzban (2010) and Molden et al. (2012) showed the glucose mechanism is implausible: self-control tasks consume negligible glucose (~0.1 cal), and the 'glucose gargling' effect (where just rinsing sugar in the mouth without swallowing restores performance) is inconsistent with a metabolic depletion account.",
      "effects": [
        { "claimId": "claim_glucose_mechanism", "effect": -0.85 },
        { "claimId": "claim_motivation_account", "effect": 0.4 }
      ]
    },
    {
      "id": "ev_job_dweck_beliefs",
      "text": "Job, Dweck, & Walton (2010, Psychological Science) showed that ego depletion effects only appear in people who believe willpower is limited. Participants who view willpower as non-limited show no performance decline, suggesting the effect is driven by beliefs and motivation rather than resource depletion.",
      "effects": [
        { "claimId": "claim_ego_depletion", "effect": -0.4 },
        { "claimId": "claim_motivation_account", "effect": 0.7 }
      ]
    }
  ],
