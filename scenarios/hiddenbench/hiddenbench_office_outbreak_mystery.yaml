    "instruction": "You are employees on the safety committee of MetroLoop Inc., called together urgently to advise management after 12 people fell ill at company headquarters. The company cafeteria is under scrutiny, but the source of the outbreak isn’t yet confirmed. Your team must quickly identify the likely cause to guide containment actions. You have three leading hypotheses:\n- Food poisoning from the cafeteria\n- Contaminated water supply\n- Airborne toxin from the HVAC system\nEach of you has received reports or observations not known by others. The company needs your answer within 15 minutes. Speed matters, but so does accuracy—acting on the wrong cause may harm colleagues.\n\nShared information known to all participants:\n- All 12 sick employees had lunch in the company cafeteria on the day symptoms began.\n- Several cafeteria staff are also reporting mild symptoms.\n- Water samples from office faucets showed no immediate contamination in preliminary tests.\n- Symptoms included nausea and dizziness, reported by all affected employees within an hour after lunch.\n\nChoose the best answer from: Cafeteria Food, Contaminated Water Supply, Airborne Toxin from HVAC."
