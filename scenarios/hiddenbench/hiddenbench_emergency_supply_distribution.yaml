    "correctClaimId": "answer_charlie_storage",
    "instruction": "You are the logistics team for Disaster Aid Response, assigned to distribute urgent relief supplies to a small city after a severe ice storm. Three local storage sites (Alpha, Bravo, Charlie) hold different types of supplies. Your warehouse lost power several hours ago. You have one truck available, and must pick only ONE storage site to visit, loading all needed supplies in a single trip. Speed is important: another storm front may arrive within hours. The goal is to restock the local hospital and shelters with food and medicine before conditions worsen. Each of the three sites has previously reported being stocked as of two days ago. However, access and storage conditions may have changed after the ice storm. Only one site actually contains usable and deliverable supplies now. Which site should you dispatch the truck to?\n\nShared information known to all participants:\n- Alpha Storage is the closest and is known to have backup generators for refrigeration; it is also reported to contain both food and medical supplies.\n- Bravo Storage is about 10km away, and only accessible via a steep road; it mostly stores canned food and dry goods.\n- Charlie Storage is furthest away and sits behind a rail crossing where the barrier arms sometimes get stuck during storms, causing delays.\n- Reports after the storm say that all three facilities experienced brief power outages, but the status of their backup systems was unconfirmed as of yesterday.\n\nChoose the best answer from: Alpha Storage, Bravo Storage, Charlie Storage."
  },
