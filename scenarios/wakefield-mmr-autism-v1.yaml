      "text": "Wakefield et al. (1998, The Lancet) reported on 12 children referred to a gastroenterology clinic, noting onset of behavioral symptoms after MMR vaccination. The paper suggested a link between MMR, a novel 'autistic enterocolitis', and autism. The paper received massive media coverage.",
