    "instruction": "You are part of a four-person team planning a critical company offsite event set for tomorrow. The event must proceed as scheduled, and all the most important clients and company leaders are set to attend. However, a city-wide transport crisis has just broken out: major subway lines are shut down, roads are jammed due to a multi-car pileup, and forecasts predict severe weather later in the day.\n\nYou have three potential venues ready to go. Each provides similar meeting facilities and catering, but due to the evolving crisis, it is vital to pick the venue that everyone can actually reach, that will not become isolated, and where basic services (food, power) will be reliable. Your team's decision is final and must be made quickly.\n\nShared information known to all participants:\n- Downtown Hotel is on the main metro line with many taxis queued up nearby.\n- The Riverside Conference Center has backup power and is outside of the most congested traffic zones.\n- Hilltop Retreat is accessible by two highways and has plenty of parking, though it lacks standard public transport connections.\n- All venues currently have food for 100 attendees and backup generators.\n\nChoose the best answer from: Downtown Hotel, Riverside Conference Center, Hilltop Retreat."
