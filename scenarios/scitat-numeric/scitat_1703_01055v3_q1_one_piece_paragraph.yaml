      "citation": "SciTaT item 1703.01055v3-q1",
      "summary": "The computational domain is $[0,1]\\times[0,1]$. The periodic boundary \ncondition is applied. We perform the convergence test on both uniform and \nnon-uniform meshes (see Fig. \\ref{fig:tri} for the coarse mesh). The uniform \nmesh is generated by dividing rectangular cells along the diagonal direction,\nwhile the non-uniform mesh is generated by the Delaunay triangulation of\nEasyMesh \\cite{EasyMesh}. The upwind flux is adopted as the numerical flux and\nthe CFL number is $0.3$. We present quantitative comparisons of solution errors\nas well as the reconstruction cost until $t=1$ in Tables \\ref{tab:sinewavere}\nand \\ref{tab:sinewaveir}, where we include the MLP limiter (version u1)\n\\cite{Park2010} as a representative example of limiters involving the Moore\nneighbors. It is found that even though MLP is slightly better than our ILR,\nthey behave quite similar in the accuracy and efficiency. As a comparison,\nBarth's limiter has the advantage on the efficiency, but it only gives rise to\nfirst-order accuracy. Moreover, it was observed in this numerical test that the\niteration of QP solver converges in roughly two steps on average, which\nconfirms the excellent performance of ILR.",
