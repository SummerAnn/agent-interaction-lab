    "instruction": "You are serving on an emergency planning team for a scenic region hosting a national outdoor festival. As thunderstorms approach, authorities must evacuate everyone to safety. There are three official evacuation locations, all reportedly equipped and expecting displaced guests: Blueberry Ridge (a woodland lodge), Green Valley (a campground center), and Red Lake (a lakeside community hall). Authorities stress that time is short—you must urgently advise all festival-goers which evacuation site to use. You know that routes to all three seem open, but heavy rain may have caused unexpected damage or hazards. Only one option is safe, accessible, and prepared for immediate evacuation. Your group must recommend the best location based on the latest information, aiming to maximize the number of people evacuated safely.\n\nShared information known to all participants:\n- Roads leading to all three evacuation sites were inspected this morning and declared passable by local highway patrols.\n- Blueberry Ridge lodge has emergency power generators and a medical station; you hear that the lodge has started preparing rooms for potential evacuees.\n- Red Lake community hall has hosted large groups before, including last year's festival overflow, and reportedly received bulk food supplies earlier today.\n- The Green Valley campground recently had a pest outbreak, and you notice local authorities have posted warning signs. However, you hear that the main building is preparing cots and handing out blankets for arrivals.\n\nChoose the best answer from: Blueberry Ridge, Green Valley, Red Lake."
