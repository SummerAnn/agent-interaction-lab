      "citation": "SciTaT item 2402.00657v1-q1",
      "summary": "\\subsubsection {Results}\nTable~\\ref{tab:partial_pdg_prediction_results} shows the evaluation results of PDBERT on partial code in terms of F1-score.\nThe results presented in the ``Overall'' row are calculated on the combination of control and data dependencies.\nWe can see that PDBERT performs very well on CDP, achieving F1-scores of about 99\\% for all Ks.\nAs for DDP, PDBERT achieves F1-scores of over 95\\%, which is also impressive.\nNote that for each code snippet, DDP instances are highly imbalanced.\nThus, DDP is more challenging than CDP.\nThe overall F1-scores of PDBERT are over 96\\% for all Ks, indicating the feasibility and effectiveness of PDBERT in analyzing program dependencies for partial code.\nWe also notice that the control, data and overall F1-scores of PDBERT slightly decrease as $K$ increases.\nThis trend is attributed to the increased difficulty in analyzing long code snippets compared to shorter ones.\nPlease note that existing static analysis tools, e.g., Joern, lack the ability to automatically derive program dependencies in partial code, and thus are unsuitable for this scenario.",
