      "text": "[Herndon, Ash, and Pollin, 2014] A recalculation found coding, data-selection, and weighting problems in the disputed postwar calculation. For the high-debt group, it reported 2.2 percent average annual growth rather than the original negative estimate. This card challenges the proposed sharp cutoff; it does not show that debt and growth are unrelated everywhere.",
      "visibleToAgentIds": ["analyst_2"],
      "effects": [{"claimId": "candidate_sharp_causal_cutoff", "effect": -0.9}, {"claimId": "candidate_qualified_conclusion", "effect": 0.7}]
