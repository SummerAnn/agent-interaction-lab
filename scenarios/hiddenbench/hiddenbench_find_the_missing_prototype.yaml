    "correctClaimId": "answer_ceo_s_office",
    "instruction": "You are part of a crisis response team at a technology company the morning after a high-security incident: the company's new prototype device disappeared overnight. The CEO has called a meeting to coordinate the investigation and recover the prototype before the press arrives in three hours. The device is too large to have been taken out of the main office building, so it must be somewhere on this floor.\n\nYour Task:\nYou and three other team members must decide where to search first. There are three candidate locations:\n- Conference Room\n- Storage Room\n- CEO's Office\n\nYou must investigate only one location (you have one chance). If you find the prototype, the company avoids disaster and everyone gets a bonus. If not, security will sweep the other locations, but it may be too late (the press may find out).\n\nShared information known to all participants:\n- The prototype device was last reported being wheeled down the main hallway toward the storage room late last night.\n- Security camera footage shows no suspicious activity in the hallways during the night.\n- The storage room and conference room are both located on the east side of the floor, while the CEO's office is on the west side.\n- The only staff authorized to enter all three locations are the four team participants (you) and the CEO.\n\nChoose the best answer from: Conference Room, Storage Room, CEO's Office."
  },
