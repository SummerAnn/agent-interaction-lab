    "instruction": "Your team is tasked with ensuring the safe delivery of a vital energy artifact needed to restore the region's power grid after a blackout. There are three facilities that could receive the artifact: Aurora Station, Beacon Post, and Canyon Depot. Each site has been used for similar deliveries in the past, but complex conditions due to the blackout make this delivery especially difficult. Communications are partially down, so each of you receives a special update from a different source on the ground, but you have only a few minutes to make a final delivery decision as power must be restored urgently. The artifact will only function if delivered to a location that meets precise criteria for access, security, and operational readiness.\n\nShared information known to all participants:\n- Aurora Station broadcasts the only still-active emergency signal requesting delivery and appears to have security personnel on-site.\n- Road sensors suggest recent vehicular traffic toward Aurora Station but not toward other sites.\n- Beacon Post and Canyon Depot both lacked updated communication logs as of an hour ago.\n- Official logistics records list Aurora Station as the primary candidate for artifact storage during emergencies.\n\nChoose the best answer from: Aurora Station, Beacon Post, Canyon Depot."
